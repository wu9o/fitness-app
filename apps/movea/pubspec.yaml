name: movea
description: 动迹 Movea, a local-first activity and health companion.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.0'
dependencies:
  flutter:
    sdk: flutter
  movea_domain:
    path: ../../packages/movea_domain
  movea_data:
    path: ../../packages/movea_data
  movea_design:
    path: ../../packages/movea_design
  flutter_map: ^8.3.2
  flutter_map_vector_tiles: ^2.8.1
  latlong2: ^0.9.1
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/maps/movea-minimal.json
