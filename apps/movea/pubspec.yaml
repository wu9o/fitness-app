name: movea
description: 动迹 Movea, a local-first activity and health companion.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.0'
dependencies:
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.5
  movea_domain:
    path: ../../packages/movea_domain
  movea_data:
    path: ../../packages/movea_data
  movea_design:
    path: ../../packages/movea_design
  latlong2: ^0.9.1
  geolocator: ^14.0.3
  geolocator_apple: ^2.3.14
  maplibre: ^0.3.6
  maplibre_webview: ^0.3.5
  flutter_svg: ^2.2.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  config:
    enable-swift-package-manager: true
  assets:
    - assets/maps/movea-minimal.json
    - assets/exercises/
