name: Feature request
description: Propose a focused product or engineering improvement
title: '[Feature]: '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should Movea solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed experience
      description: Describe the flow and the expected outcome.
    validations:
      required: true
  - type: checkboxes
    id: platforms
    attributes:
      label: Platforms
      options:
        - label: iPhone
        - label: iPad
        - label: macOS
        - label: Android
        - label: Apple Watch
  - type: textarea
    id: privacy
    attributes:
      label: Health, location, or privacy impact
      description: Explain any new sensitive data, permissions, or external services.
